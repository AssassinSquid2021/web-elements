<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Room test</title>
    <style>
        body { margin: 0; background: #222; }
        
        .room { position: relative; width: 100%; max-width: 960px; margin: 0 auto; container-type: inline-size; display: grid;}
        
        .room img {
            display: block;
            width: 100%;
            image-rendering: pixelated;
        }

        .room > * {
            grid-area: 1 / 1;
        } 
        
    </style>

</head>
<body>
        <div class="room">
        <div><img src="background.png"></div>
        <div><img src="recliner.png"></div>
        <div><img src="me_sitting.png"></div>
        <div><img src="recliner_foreground.png"></div>

    </div>

</body>
</html>
